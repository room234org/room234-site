    <circle cx="460" cy="260" r="45"/><rect x="420" y="305" width="110" height="220" rx="16"/>
    <circle cx="680" cy="300" r="50"/><rect x="640" y="350" width="120" height="210" rx="18"/>
    <circle cx="900" cy="270" r="44"/><rect x="860" y="315" width="110" height="220" rx="16"/>
    <circle cx="1100" cy="310" r="46"/><rect x="1060" y="355" width="120" height="210" rx="18"/>
