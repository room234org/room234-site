<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Room 234</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__brand">
      <img src="assets/img/room234-logo.png" alt="Room 234 Logo" class="logo">
      <span class="brand">Room 234</span>
    </div>
    <nav class="nav__links">
      <a href="index.html">Home</a>
      <a href="artists.html">Artists</a>
      <a href="events.html">Events</a>
      <a href="studio.html">Studio</a>
      <a href="community.html">Community</a>
      <a href="contact.html" class="btn btn--gold active">Contact</a>
    </nav>
  </header>

  <main class="page">
    <h1>Contact</h1>
    <p class="lede">For bookings, partnerships, press and demos.</p>

    <form action="https://formspree.io/f/yourFormID" method="POST" class="card">
      <label>Your name</label>
      <input name="name" required />
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Message</label>
      <textarea name="message" rows="5" required></textarea>
      <button class="btn btn--gold" type="submit">Send</button>
    </form>

    <p class="muted">Or email us directly: <a href="mailto:room234uk@gmail.com">room234uk@gmail.com</a></p>
  </main>

  <footer class="footer">
    <div><img src="assets/img/room234-logo.png" class="logo--sm" alt=""></div>
    <div class="footer__links">
      <a href="https://instagram.com/room.234_" target="_blank">Instagram</a>
      <a href="mailto:room234uk@gmail.com">room234uk@gmail.com</a>
      <span>London • Port Harcourt</span>
    </div>
    <div class="tiny">© Room 234.</div>
  </footer>
</body>
</html>
